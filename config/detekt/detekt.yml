# Only the differences from detekt's default config (buildUponDefaultConfig = true).

complexity:
  # NotesViewModel is the app's single ViewModel and exposes one function per user action.
  TooManyFunctions:
    allowedFunctionsPerClass: 20
  # Composable screens are long, branchy layout code; splitting them only for the metric hurts readability.
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MaxLineLength:
    maxLineLength: 150
  # dp, sp, alpha and animation values in UI code are design values, not magic numbers.
  MagicNumber:
    ignoreAnnotated: ['Composable']
    # Enum entries carry their value (e.g. LockTimeout's milliseconds) right where they are named.
    ignoreEnums: true

Compose:
  # LocalNotePalette keeps note colors on the amber scheme while dynamic colors restyle the app;
  # LocalSharedNoteScope lets a note card grow into its editor without threading scopes through every screen.
  # LocalImageStore hands the pictures' store to cards and the editor, like the palette it is not a screen's input.
  CompositionLocalAllowlist:
    allowedCompositionLocals: ['LocalNotePalette', 'LocalSharedNoteScope', 'LocalImageStore']
