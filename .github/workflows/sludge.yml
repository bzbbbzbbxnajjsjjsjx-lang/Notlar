name: Sludge EQ

on:
  push:
    branches: ["**"]
    # Tags are not filtered by paths; "sludge-v*" never matches the notes app's "v*" release tags.
    tags: ["sludge-v*"]
    paths: ["sludge/**", ".github/workflows/sludge.yml"]
  pull_request:
    paths: ["sludge/**", ".github/workflows/sludge.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release etiketi (ör. sludge-v1.0.0); boş bırakılırsa sadece derler"
        required: false
        default: ""

permissions:
  contents: write

defaults:
  run:
    working-directory: sludge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: sludge

      - name: Detekt
        run: ./gradlew detekt --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit and screenshot tests
        run: ./gradlew verifyRoborazziDebug --stacktrace

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sludge-screenshot-diffs
          path: sludge/app/build/outputs/roborazzi/

      - name: Build APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sludge-eq-apk
          path: |
            sludge/app/build/outputs/apk/debug/app-debug.apk
            sludge/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/sludge-v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        working-directory: .
        run: |
          cp sludge/app/build/outputs/apk/release/app-release.apk "SludgeEQ-$TAG.apk"
          gh release create "$TAG" "SludgeEQ-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sludge EQ $TAG" \
            --notes-file sludge/release-notes.md
